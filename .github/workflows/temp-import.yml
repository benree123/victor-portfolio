name: Temporary site import
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base=https://victor-portfolio-pied.vercel.app
          mkdir -p assets
          curl -fsSL "$base/" -o index.html
          curl -fsSL "$base/style.css" -o style.css
          curl -fsSL "$base/script.js" -o script.js
          curl -fsSL "$base/assets/favicon.svg" -o assets/favicon.svg
          curl -fsSL "$base/assets/Victor-Okere-Resume.pdf" -o assets/Victor-Okere-Resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-import.yml
          git add index.html style.css script.js assets
          git commit -m "Import the published portfolio files"
          git push
